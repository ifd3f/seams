[package]
name = "seams"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base16 = "0.2.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
comrak = { version = "0.52.0", features = ["emojis", "shortcodes"] }
csscolorparser = { version = "0.6.2", features = ["serde"] }
derive_more = "0.99.20"
frunk = "0.4.4"
futures = "0.3.32"
gray_matter = "0.2.9"
html-escape = "0.2.13"
html_parser = "0.7.0"
htmlentity = "1.3.2"
itertools = "0.12.1"
maud = "0.26.0"
md5 = "0.7.0"
mime = "0.3.17"
mime_guess = "2.0.5"
nom = "7.1.3"
open = "5.3.5"
palette = "0.7.6"
rand = "0.8.6"
rand_chacha = "0.3.1"
rss = { version = "2.0.13", features = ["atom", "validation"] }
rust-s3 = "0.33.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "1.0.69"
tokio = { version = "1.52.3", features = ["process", "fs", "tracing", "time", "sync", "io-util", "macros", "rt"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vfs = "0.10.0"
walkdir = "2.5.0"

[dev-dependencies]
assert_matches = "1.5.0"
rstest = "0.18.2"
scraper = "0.18.1"
selectors = "0.25.0"
